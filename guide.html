<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>抖音 · 致每一位好好生活的人</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: 'Noto Serif SC', serif; }

  body {
    background: #0d0905;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* ===== 背景层 ===== */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,200,120,.18) 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 50% 55%, rgba(180,110,50,.12) 0%, transparent 60%),
      linear-gradient(180deg, #1c1308 0%, #120c05 40%, #0a0603 100%);
  }

  /* 聚光灯光柱 */
  .spotlight {
    position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
    width: 60%; height: 90%;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,210,140,.22) 0%, rgba(255,180,90,.08) 30%, transparent 70%);
    pointer-events: none;
    filter: blur(20px);
  }

  /* ===== 漂浮纸张 ===== */
  .paper {
    position: absolute;
    background: linear-gradient(135deg, #f5ecd9 0%, #e8d9b8 100%);
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    opacity: .85;
  }
  .paper::before {
    content: ''; position: absolute; inset: 8px;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 14px, rgba(120,80,40,.15) 14px, rgba(120,80,40,.15) 15px);
    opacity: .5;
  }

  .paper-1 {
    top: 3%; left: 8%; width: 90px; height: 120px;
    transform: rotate(-18deg);
    background: linear-gradient(135deg, #f0e6cf, #ddd0b0);
  }
  .paper-2 {
    top: 6%; right: 10%; width: 80px; height: 110px;
    transform: rotate(15deg);
    background: linear-gradient(135deg, #ede2c8, #d8c9a6);
  }
  .paper-3 {
    bottom: 18%; left: 5%; width: 100px; height: 70px;
    transform: rotate(-8deg);
  }
  .paper-4 {
    bottom: 8%; right: 6%; width: 130px; height: 90px;
    transform: rotate(12deg);
    background: linear-gradient(135deg, #f3ead5, #e0d2af);
  }
  .paper-5 {
    top: 45%; left: 3%; width: 60px; height: 80px;
    transform: rotate(-25deg);
    opacity: .6;
  }

  /* ===== 主容器 ===== */
  .container {
    position: relative; z-index: 10;
    width: 100%; max-width: 440px; height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 40px 20px;
  }

  /* ===== 标题 ===== */
  .title-wrap {
    text-align: center; margin-bottom: 30px;
    position: relative; z-index: 20;
  }
  .title {
    font-family: 'Ma Shan Zheng', 'ZCOOL KuaiLe', cursive;
    font-size: 52px; line-height: 1.15;
    color: #fff;
    text-shadow:
      0 2px 8px rgba(0,0,0,.6),
      0 0 30px rgba(255,200,120,.25);
    letter-spacing: 2px;
  }
  .subtitle {
    margin-top: 16px;
    font-size: 15px; letter-spacing: 6px;
    color: rgba(255,220,170,.85);
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .subtitle::before, .subtitle::after {
    content: ''; width: 28px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,200,140,.6));
  }
  .subtitle::after { background: linear-gradient(90deg, rgba(255,200,140,.6), transparent); }

  /* ===== 手机框 ===== */
  .phone-stage {
    position: relative; width: 300px; height: 560px;
    border-radius: 42px;
    background: linear-gradient(180deg, #2a1d10 0%, #1a1209 100%);
    box-shadow:
      0 0 0 2px rgba(255,210,150,.25),
      0 0 0 5px rgba(0,0,0,.5),
      0 30px 80px rgba(0,0,0,.7),
      0 0 60px rgba(255,160,60,.08);
    overflow: hidden;
  }

  /* 手机内屏幕 */
  .phone-screen {
    position: absolute; inset: 8px;
    border-radius: 36px;
    background: radial-gradient(ellipse at 50% 20%, #3a2a18 0%, #221608 50%, #140d05 100%);
    overflow: hidden;
  }

  /* 手机内聚光灯 */
  .inner-light {
    position: absolute; top: -20%; left: 50%; transform: translateX(-50%);
    width: 200%; height: 80%;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,210,140,.35) 0%, rgba(255,180,80,.1) 35%, transparent 65%);
    filter: blur(8px);
    pointer-events: none;
  }

  /* ===== 纸艺音符 (抖音logo风格) ===== */
  .music-note {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -55%);
    width: 180px; height: 220px;
    z-index: 5;
  }
  /* 音符主体 - 用渐变模拟纸艺 */
  .note-stem {
    position: absolute; right: 30px; top: 10px;
    width: 14px; height: 150px;
    background: linear-gradient(90deg, #d4b88a 0%, #f5e6c8 40%, #fff8e8 50%, #e8d5a8 70%, #c9a870 100%);
    border-radius: 3px;
    box-shadow: 2px 0 6px rgba(0,0,0,.3);
  }
  .note-head-1 {
    position: absolute; bottom: 0; left: 0;
    width: 80px; height: 60px;
    background: linear-gradient(135deg, #e8d5a8 0%, #fff8e8 50%, #d4b88a 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    transform: rotate(-20deg);
    box-shadow: inset -4px -4px 10px rgba(120,80,30,.3), 4px 4px 12px rgba(0,0,0,.4);
  }
  .note-head-2 {
    position: absolute; bottom: 50px; left: 55px;
    width: 70px; height: 52px;
    background: linear-gradient(135deg, #e8d5a8 0%, #fff8e8 50%, #d4b88a 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    transform: rotate(-20deg);
    box-shadow: inset -4px -4px 10px rgba(120,80,30,.3), 4px 4px 12px rgba(0,0,0,.4);
  }
  /* 音符上的折痕高光 */
  .note-stem::after {
    content: ''; position: absolute; left: 4px; top: 0; bottom: 0;
    width: 3px; background: rgba(255,255,255,.4); border-radius: 2px;
  }

  /* ===== 书桌场景 ===== */
  .desk-scene {
    position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
    z-index: 10;
  }
  /* 桌面 */
  .desk {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    width: 240px; height: 14px;
    background: linear-gradient(180deg, #b8884a 0%, #8a6230 50%, #6a4a20 100%);
    border-radius: 3px;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  .desk::before {
    content: ''; position: absolute; top: -4px; left: 10px; right: 10px; height: 4px;
    background: linear-gradient(180deg, #d4a560, #b8884a);
    border-radius: 3px 3px 0 0;
  }
  /* 桌腿 */
  .desk-leg-l, .desk-leg-r {
    position: absolute; bottom: 0; width: 8px; height: 42px;
    background: linear-gradient(90deg, #6a4a20, #8a6230, #6a4a20);
  }
  .desk-leg-l { left: 30px; }
  .desk-leg-r { right: 30px; }

  /* 绿色椅子 */
  .chair {
    position: absolute; bottom: 42px; left: 18px;
    z-index: 11;
  }
  .chair-seat {
    width: 48px; height: 14px;
    background: linear-gradient(180deg, #6aa86a, #4a7a4a);
    border-radius: 6px 6px 3px 3px;
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }
  .chair-back {
    position: absolute; bottom: 12px; left: -4px;
    width: 12px; height: 50px;
    background: linear-gradient(90deg, #5a9a5a, #7ab87a, #5a9a5a);
    border-radius: 6px;
    transform: rotate(-5deg);
  }
  .chair-leg {
    position: absolute; bottom: -30px; width: 5px; height: 32px;
    background: #3a2a1a; border-radius: 2px;
  }
  .chair-leg.f-l { left: 4px; transform: rotate(3deg); }
  .chair-leg.b-l { left: 14px; }
  .chair-leg.f-r { right: 14px; }
  .chair-leg.b-r { right: 4px; transform: rotate(-3deg); }

  /* 小提琴 */
  .violin {
    position: absolute; bottom: 56px; left: 72px;
    width: 22px; height: 60px; z-index: 12;
    transform: rotate(15deg);
  }
  .violin-body {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 22px; height: 36px;
    background: linear-gradient(135deg, #c9773a, #8a4a1a);
    border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
    box-shadow: inset -2px -2px 5px rgba(0,0,0,.3);
  }
  .violin-body::after {
    content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 12px; background: #2a1a0a; border-radius: 50%;
  }
  .violin-neck {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 5px; height: 28px; background: #5a3a1a; border-radius: 2px;
  }

  /* 相机三脚架 */
  .tripod {
    position: absolute; bottom: 54px; right: 60px; z-index: 12;
  }
  .camera {
    width: 26px; height: 18px;
    background: linear-gradient(180deg, #4a4a4a, #2a2a2a);
    border-radius: 4px;
    position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .camera::before {
    content: ''; position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle, #1a1a1a 30%, #3a3a3a 70%);
    box-shadow: inset 0 0 4px rgba(255,255,255,.3);
  }
  .camera::after {
    content: ''; position: absolute; top: -3px; left: 4px;
    width: 4px; height: 4px; background: #666; border-radius: 1px;
  }
  .tripod-legs {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    width: 1px; height: 30px; background: #555;
  }
  .tripod-legs::before, .tripod-legs::after {
    content: ''; position: absolute; top: 0; left: 0;
    width: 1px; height: 30px; background: #555;
  }
  .tripod-legs::before { transform: rotate(25deg); transform-origin: top; }
  .tripod-legs::after { transform: rotate(-25deg); transform-origin: top; }

  /* 化妆镜 */
  .mirror {
    position: absolute; bottom: 56px; right: 100px; z-index: 11;
  }
  .mirror-frame {
    width: 28px; height: 34px;
    border: 3px solid #c9a870; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(ellipse at 30% 30%, #e8e0d0, #b8a890 70%, #8a7a60);
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .mirror-stand {
    width: 3px; height: 10px; background: #8a6a30; margin: 0 auto;
  }
  .mirror-base {
    width: 16px; height: 4px; background: #8a6a30; border-radius: 2px; margin: 0 auto;
  }

  /* 雕塑头像 */
  .bust {
    position: absolute; bottom: 54px; right: 30px; z-index: 13;
  }
  .bust-head {
    width: 22px; height: 26px;
    background: linear-gradient(135deg, #f0e8d8 0%, #d8cdb8 50%, #b8a890 100%);
    border-radius: 45% 45% 40% 40%;
    position: relative;
    box-shadow: inset -3px -2px 5px rgba(100,80,50,.3);
  }
  .bust-head::before {
    content: ''; position: absolute; top: 6px; left: 4px;
    width: 5px; height: 3px; background: rgba(100,80,50,.4); border-radius: 50%;
  }
  .bust-head::after {
    content: ''; position: absolute; top: 6px; right: 4px;
    width: 5px; height: 3px; background: rgba(100,80,50,.4); border-radius: 50%;
  }
  .bust-neck {
    width: 12px; height: 6px; background: #c8bda8; margin: 0 auto;
  }
  .bust-shoulders {
    width: 34px; height: 10px;
    background: linear-gradient(180deg, #e0d4c0, #b8a890);
    border-radius: 8px 8px 4px 4px;
  }

  /* 绿植 */
  .plant {
    position: absolute; bottom: 54px; right: 6px; z-index: 13;
  }
  .plant-pot {
    width: 20px; height: 16px;
    background: linear-gradient(180deg, #a06030, #704020);
    border-radius: 2px 2px 6px 6px;
    position: relative;
  }
  .plant-pot::before {
    content: ''; position: absolute; top: -2px; left: -2px; right: -2px; height: 4px;
    background: #8a5020; border-radius: 2px;
  }
  .leaf {
    position: absolute; width: 10px; height: 18px;
    background: linear-gradient(135deg, #4a8a3a, #2a5a1a);
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    box-shadow: inset 1px 1px 2px rgba(255,255,255,.2);
  }
  .leaf-1 { top: -16px; left: 2px; transform: rotate(-20deg); }
  .leaf-2 { top: -20px; left: 8px; transform: rotate(5deg); }
  .leaf-3 { top: -14px; right: 0px; transform: rotate(25deg); }

  /* 哑铃 */
  .dumbbell {
    position: absolute; bottom: 48px; left: 130px; z-index: 11;
    transform: rotate(-10deg);
  }
  .dumbbell-bar {
    width: 26px; height: 4px; background: #888; border-radius: 2px;
  }
  .dumbbell-weight {
    position: absolute; top: -4px; width: 7px; height: 12px;
    background: linear-gradient(180deg, #aaa, #666); border-radius: 2px;
  }
  .dumbbell-weight.l { left: -2px; }
  .dumbbell-weight.r { right: -2px; }

  /* 地面光圈 */
  .floor-glow {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 260px; height: 60px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,180,80,.25) 0%, transparent 70%);
    filter: blur(6px);
  }

  /* ===== 漂浮碎纸片 ===== */
  .confetti {
    position: absolute; z-index: 6;
    background: linear-gradient(135deg, #f5ecd9, #e0d0a8);
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .c1 { top: 30%; left: 12%; width: 20px; height: 28px; transform: rotate(35deg); opacity: .7; }
  .c2 { top: 38%; right: 8%; width: 16px; height: 22px; transform: rotate(-15deg); opacity: .6; }
  .c3 { top: 55%; left: 6%; width: 14px; height: 20px; transform: rotate(50deg); opacity: .5; }
  .c4 { top: 48%; right: 14%; width: 12px; height: 18px; transform: rotate(-40deg); opacity: .55; }
  .c5 { top: 65%; left: 18%; width: 10px; height: 14px; transform: rotate(20deg); opacity: .4; }

  /* ===== 漂浮光点 ===== */
  .sparkle {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255,220,160,.9);
    box-shadow: 0 0 8px rgba(255,200,120,.8);
    z-index: 7;
  }
  .s1 { top: 25%; left: 30%; animation: twinkle 3s infinite; }
  .s2 { top: 40%; right: 25%; animation: twinkle 3.5s infinite .5s; }
  .s3 { top: 60%; left: 40%; animation: twinkle 2.8s infinite 1s; }
  .s4 { top: 35%; left: 60%; animation: twinkle 3.2s infinite 1.5s; }
  .s5 { top: 70%; right: 30%; animation: twinkle 2.5s infinite .8s; }

  @keyframes twinkle {
    0%, 100% { opacity: .2; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* ===== 底部进入按钮 ===== */
  .enter-btn {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    z-index: 30;
    padding: 12px 44px;
    background: linear-gradient(135deg, #fe2c55, #ff4d6d);
    color: #fff; border: none; border-radius: 30px;
    font-size: 15px; font-weight: 700; letter-spacing: 2px;
    box-shadow: 0 8px 24px rgba(254,44,85,.4), 0 0 40px rgba(254,44,85,.2);
    cursor: pointer; transition: transform .2s, box-shadow .2s;
  }
  .enter-btn:active { transform: translateX(-50%) scale(.95); }

  /* 底部小字 */
  .bottom-text {
    position: absolute; bottom: 16px; left: 0; right: 0;
    text-align: center; font-size: 10px; color: rgba(255,255,255,.3);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="spotlight"></div>

<!-- 漂浮纸张 -->
<div class="paper paper-1"></div>
<div class="paper paper-2"></div>
<div class="paper paper-3"></div>
<div class="paper paper-4"></div>
<div class="paper paper-5"></div>

<div class="container">

  <!-- 标题 -->
  <div class="title-wrap">
    <div class="title">致每一位<br/>好好生活的人</div>
    <div class="subtitle">抖音 · 生活者说</div>
  </div>

  <!-- 手机舞台 -->
  <div class="phone-stage">
    <div class="phone-screen">
      <div class="inner-light"></div>

      <!-- 漂浮碎纸片 -->
      <div class="confetti c1"></div>
      <div class="confetti c2"></div>
      <div class="confetti c3"></div>
      <div class="confetti c4"></div>
      <div class="confetti c5"></div>

      <!-- 光点 -->
      <div class="sparkle s1"></div>
      <div class="sparkle s2"></div>
      <div class="sparkle s3"></div>
      <div class="sparkle s4"></div>
      <div class="sparkle s5"></div>

      <!-- 纸艺音符 -->
      <div class="music-note">
        <div class="note-head-2"></div>
        <div class="note-head-1"></div>
        <div class="note-stem"></div>
      </div>

      <!-- 书桌场景 -->
      <div class="desk-scene">
        <div class="floor-glow"></div>

        <!-- 椅子 -->
        <div class="chair">
          <div class="chair-back"></div>
          <div class="chair-seat"></div>
          <div class="chair-leg f-l"></div>
          <div class="chair-leg b-l"></div>
          <div class="chair-leg f-r"></div>
          <div class="chair-leg b-r"></div>
        </div>

        <!-- 小提琴 -->
        <div class="violin">
          <div class="violin-neck"></div>
          <div class="violin-body"></div>
        </div>

        <!-- 桌面 -->
        <div class="desk"></div>
        <div class="desk-leg-l"></div>
        <div class="desk-leg-r"></div>

        <!-- 化妆镜 -->
        <div class="mirror">
          <div class="mirror-frame"></div>
          <div class="mirror-stand"></div>
          <div class="mirror-base"></div>
        </div>

        <!-- 相机+三脚架 -->
        <div class="tripod">
          <div class="camera"></div>
          <div class="tripod-legs"></div>
        </div>

        <!-- 雕塑头像 -->
        <div class="bust">
          <div class="bust-head"></div>
          <div class="bust-neck"></div>
          <div class="bust-shoulders"></div>
        </div>

        <!-- 绿植 -->
        <div class="plant">
          <div class="leaf leaf-1"></div>
          <div class="leaf leaf-2"></div>
          <div class="leaf leaf-3"></div>
          <div class="plant-pot"></div>
        </div>

        <!-- 哑铃 -->
        <div class="dumbbell">
          <div class="dumbbell-bar"></div>
          <div class="dumbbell-weight l"></div>
          <div class="dumbbell-weight r"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="enter-btn" onclick="alert('进入抖音')">开 始 体 验</button>
  <div class="bottom-text">抖音 · 记录美好生活</div>

</div>

</body>
</html>
