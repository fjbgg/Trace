<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音 UI 图集</title>
<style>
  :root{--bg:#0e0e12;--card:#17171e;--line:#26262f;--fg:#e8e8ef;--dim:#9a9aa8;--accent:#25f4ee;}
  *{box-sizing:border-box}
  body{margin:0;padding:32px 20px 64px;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{max-width:1100px;margin:0 auto 28px}
  h1{margin:0 0 8px;font-size:24px}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:13px;line-height:1.7}
  h2{max-width:1100px;margin:36px auto 14px;font-size:16px;color:var(--accent);
     border-left:3px solid var(--accent);padding-left:10px}
  .grid{max-width:1100px;margin:0 auto;display:grid;
        grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
         overflow:hidden;display:flex;flex-direction:column}
  figure img{width:100%;display:block;background:#000;aspect-ratio:auto}
  figcaption{padding:10px 12px;font-size:13px;color:var(--fg);border-top:1px solid var(--line)}
  figcaption small{display:block;color:var(--dim);margin-top:4px;font-size:11px;line-height:1.5}
  .tag{display:inline-block;font-size:10px;color:#0e0e12;background:var(--accent);
       border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
</style>
</head>
<body>
<header>
  <h1>抖音 <span>UI 图集</span></h1>
  <p class="sub">
    全网检索到的抖音（Douyin）界面截图汇总。<br>
    来源见页面底部；图片均转存至本地 <code>douyin_ui/</code> 目录。截图为各来源文章配图，版本/时间以标注为准。
  </p>
</header>

<h2>一、最新 AI 交互界面（2026 兴趣卡 / AI 工坊）</h2>
<div class="grid">
  <figure><img src="01-ai-gongfang-site.png" alt="AI工坊独立网站"><figcaption><span class="tag">新</span>AI 工坊 · 独立网站<small>抖音 AI 创作 Agent 的 Web 端</small></figcaption></figure>
  <figure><img src="02-ai-gongfang-home.png" alt="AI工坊首页"><figcaption><span class="tag">新</span>AI 工坊 · 首页<small>经典两栏式布局，可创建兴趣卡/AI分身/小程序</small></figcaption></figure>
  <figure><img src="03-xingqu-card-in-feed.png" alt="信息流中的兴趣卡"><figcaption><span class="tag">新</span>兴趣卡 · 出现在信息流<small>首页推荐流内可直接交互的 AI 卡片</small></figcaption></figure>
  <figure><img src="04-xingqu-card-generated.png" alt="生成的兴趣卡"><figcaption><span class="tag">新</span>兴趣卡 · 生成效果<small>「日语学习」兴趣卡，卡内可交互</small></figcaption></figure>
  <figure><img src="05-xingqu-card-in-douyin.png" alt="抖音中看到的兴趣卡"><figcaption><span class="tag">新</span>兴趣卡 · 发布到抖音<small>随推荐机制分发给用户</small></figcaption></figure>
  <figure><img src="06-ai-fenshen.png" alt="AI分身"><figcaption><span class="tag">新</span>AI 分身<small>基础人设 / 技能库 / 工具箱 / 知识库 / 触发器</small></figcaption></figure>
  <figure><img src="07-ai-agent.png" alt="抖音智能体"><figcaption><span class="tag">新</span>抖音智能体<small>AI 工坊可创建的生态内容类型之一</small></figcaption></figure>
</div>

<h2>二、首页 / 导航栏改版</h2>
<div class="grid">
  <figure><img src="08-home-tabs.jpg" alt="首页顶部Tab"><figcaption>首页顶部 Tab 改版<small>推荐 / 朋友 / 关注 / 同城 / 学习 / 更多</small></figcaption></figure>
  <figure><img src="09-home-shop-entry.jpg" alt="商城入口"><figcaption>「商城」进入主界面<small>双列 Feed 的商品+直播间混排</small></figcaption></figure>
  <figure><img src="10-home-plus-button.jpg" alt="左上角加号"><figcaption>左上角「扫一扫」改为加号<small>集合 拍日常 / 发图文 / 扫一扫</small></figcaption></figure>
</div>

<h2>三、App 常规界面</h2>
<div class="grid">
  <figure><img src="11-me-page.jpg" alt="我的一页"><figcaption>「我」个人主页<small>抖音号 / 昵称 / 头像 / 背景等</small></figcaption></figure>
  <figure><img src="12-search-page.jpg" alt="搜索页"><figcaption>搜索页<small>搜索记录管理入口</small></figcaption></figure>
  <figure><img src="13-publish-page.jpg" alt="发布页"><figcaption>视频发布页<small>输入描述 → 发布</small></figcaption></figure>
  <figure><img src="14-shoot-page.jpg" alt="拍摄页"><figcaption>拍摄页（+ 号）<small>抖音短视频创作入口</small></figcaption></figure>
  <figure><img src="15-settings-entry.jpg" alt="设置入口"><figcaption>个人页右上角「三横线」<small>进入设置 / 创作者中心</small></figcaption></figure>
</div>

</html>
